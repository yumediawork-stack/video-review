---

image: node:lts

stages:
  - build
  - deploy

pages:
  stage: deploy
  script:
    - npm ci
    - npm run typecheck
    - npm run test:run
    - npm run build
    - mkdir -p public
    - cp -a dist/. public/
  artifacts:
    paths:
      - public
  pages: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
